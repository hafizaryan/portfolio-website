    <style>
        :root {
            --bg: #f8fafc;
            --surface: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #475569;
            --accent: #047857;
            --accent-bg: #d1fae5;
            --accent-border: #6ee7b7;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #09090b;
                --surface: #18181b;
                --border: #27272a;
                --text: #fafafa;
                --muted: #a1a1aa;
                --accent: #4ade80;
                --accent-bg: rgba(20, 83, 45, 0.3);
                --accent-border: #4ade80;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            background: var(--bg);
            color: var(--muted);
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        main {
            width: 100%;
            max-width: 34rem;
            text-align: center;
        }

        .avatar {
            display: block;
            width: 6rem;
            height: 6rem;
            margin: 0 auto 2rem;
            border-radius: 50%;
            border: 1px solid var(--border);
            object-fit: cover;
            background: var(--surface);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.4rem 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--accent-border);
            border-radius: 9999px;
            background: var(--accent-bg);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .dot {
            width: 0.5rem;
            height: 0.5rem;
            border-radius: 50%;
            background: currentColor;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {
            50% { opacity: 0.3; }
        }

        h1 {
            color: var(--text);
            font-size: clamp(2rem, 6vw, 2.75rem);
            font-weight: 700;
            line-height: 1.15;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.7;
        }

        .id {
            margin-top: 0.75rem;
            font-size: 0.95rem;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 2.5rem;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.65rem 1.1rem;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            transition: border-color 0.2s;
        }

        .links a:hover,
        .links a:focus-visible {
            border-color: var(--text);
        }

        .links svg {
            width: 1rem;
            height: 1rem;
            fill: currentColor;
        }

        footer {
            margin-top: 3rem;
            font-size: 0.8rem;
        }

        @media (prefers-reduced-motion: reduce) {
            .dot { animation: none; }
        }
    </style>
